        * {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animated Sky & Garden Background */
        .sky-bg {
            background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 60%, #bae6fd 100%);
        }

        /* Floating Balloon Animation */
        @keyframes floatSway {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }

        .balloon-float {
            animation: floatSway 3.5s ease-in-out infinite;
        }

        /* Flying Birds */
        @keyframes flyAcross {
            0% { transform: translateX(-120px) translateY(0); }
            50% { transform: translateX(50vw) translateY(-20px); }
            100% { transform: translateX(110vw) translateY(10px); }
        }

        .bird-flying {
            animation: flyAcross 14s linear infinite;
        }

        /* Moving Clouds */
        @keyframes cloudMove {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(100vw); }
        }

        .cloud-1 { animation: cloudMove 35s linear infinite; }
        .cloud-2 { animation: cloudMove 50s linear infinite 10s; }

        /* Custom Reticle Pointer */
        #custom-reticle {
            pointer-events: none;
            transition: transform 0.05s ease-out;
            z-index: 9999;
        }

        /* Balloon Pop Effect */
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .popping {
            animation: pop 0.3s forwards ease-out;
        }

        /* Hide Scrollbars */
        body {
            overflow: hidden;
        }
    </style>

    <!-- AUDIO ENGINE (Web Audio API Synthesizer) -->
    <script>
        // Web Audio Context for synthesized sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sound 1: Balloon Pop / Click Sound
        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Sound 2: Correct Answer Chime
        function playCorrectSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.2);
            });
        }

        // Sound 3: Incorrect Answer Buzz
        function playWrongSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);
            
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.35);
        }

        // Sound 4: Game Victory Fanfare
        function playVictorySound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.4, now + idx * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.12);
                osc.stop(now + idx * 0.12 + 0.4);
            });
        }
    </script>

    <!-- CORE GAME CONTROLLER & LOGIC -->
    <script>
        // State Variables
        let playerName = "";
        let currentLevelIdx = 0;
        let currentQuestionIdx = 0;
        let score = 0;
        let isCameraActive = false;
        let isPinching = false;
        let lastPinchTime = 0;

        // Position of custom reticle

        // DOM Elements

        const screenWelcome = document.getElementById('screen-welcome');
        const screenGame = document.getElementById('screen-game');
        const screenResult = document.getElementById('screen-result');
        const gameNavbar = document.getElementById('game-navbar');

        // Initialize Mouse and Touch Fallback Controllers
        window.addEventListener('mousemove', (e) => {
            if (!isCameraActive) {
                updateReticlePosition(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isCameraActive && e.touches.length > 0) {
                updateReticlePosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        window.addEventListener('click', (e) => {
            initAudio();
            if (!isCameraActive) {
                checkTargetHit(e.clientX, e.clientY);
            }
        });

        function updateReticlePosition(x, y) {
            reticleX = x;
            reticleY = y;
            customReticle.style.left = `${x}px`;
            customReticle.style.top = `${y}px`;
        }

        // Start Game Entry Point
        function startGame() {
            const inputVal = document.getElementById('input-name').value.trim();
            playerName = inputVal || "Pemburu Cilik";
            document.getElementById('nav-player-name').innerText = playerName;

            const checkCam = document.getElementById('check-enable-cam').checked;

            screenWelcome.classList.add('hidden');
            gameNavbar.classList.remove('hidden');
            gameNavbar.classList.add('flex');
            screenGame.classList.remove('hidden');

            currentLevelIdx = 0;
            currentQuestionIdx = 0;
            score = 0;

            updateNavbarInfo();

            if (checkCam) {
                initMediaPipeCamera();
            }

            loadQuestion();
        }

        // Update Navbar Display
        function updateNavbarInfo() {
            document.getElementById('nav-level').innerText = `Level ${currentLevelIdx + 1}`;
            document.getElementById('nav-score').innerText = score;
        }

        // Load Question & Render Balloons
        function loadQuestion() {
            const levelData = GAME_LEVELS[currentLevelIdx];
            const qData = levelData.questions[currentQuestionIdx];

            // Render Header Badges
            document.getElementById('question-type-badge').innerText = `Tipe: ${qData.type}`;
            document.getElementById('question-progress').innerText = `Soal ${currentQuestionIdx + 1} dari 3`;
            document.getElementById('question-text').innerText = qData.question;

            // Render Visual Helper Icons for Grade 1 Level
            const visualContainer = document.getElementById('visual-helpers');
            visualContainer.innerHTML = '';
            
            // Draw visual birds/items for calculation
            for (let i = 0; i < qData.num1; i++) {
                const icon = document.createElement('div');
                // Strike through subtracting items
                if (i >= (qData.num1 - qData.num2)) {
                    icon.className = 'text-red-400 text-2xl relative opacity-40';
                    icon.innerHTML = `<i class="fa-solid fa-kiwi-bird"></i><i class="fa-solid fa-xmark absolute inset-0 text-red-600 font-bold"></i>`;
                } else {
                    icon.className = 'text-sky-500 text-2xl animate-bounce';
                    icon.style.animationDelay = `${i * 0.1}s`;
                    icon.innerHTML = `<i class="fa-solid fa-kiwi-bird"></i>`;
                }
                visualContainer.appendChild(icon);
            }

            // Spawn Option Balloons
            spawnBalloons(qData.options, qData.correct);
        }

        // Spawn Interactive Target Balloons
        function spawnBalloons(options, correctAnswer) {
            const container = document.getElementById('balloons-container');
            container.innerHTML = '';

            // Shuffle options
            const shuffled = [...options].sort(() => Math.random() - 0.5);

            const colors = [
                { bg: 'from-pink-400 to-rose-500', border: 'border-pink-300', text: 'text-white' },
                { bg: 'from-amber-400 to-yellow-500', border: 'border-yellow-300', text: 'text-white' },
                { bg: 'from-emerald-400 to-green-500', border: 'border-green-300', text: 'text-white' },
                { bg: 'from-purple-400 to-indigo-500', border: 'border-indigo-300', text: 'text-white' }
            ];

            const positions = [
                { left: '15%', top: '25%' },
                { left: '50%', top: '15%' },
                { left: '80%', top: '30%' }
            ];

            shuffled.forEach((val, idx) => {
                const color = colors[idx % colors.length];
                const pos = positions[idx % positions.length];

                const balloon = document.createElement('div');
                balloon.className = `balloon-float absolute -translate-x-1/2 -translate-y-1/2 w-28 h-36 sm:w-36 sm:h-44 bg-gradient-to-t ${color.bg} rounded-full border-4 ${color.border} shadow-2xl flex flex-col items-center justify-center cursor-pointer transition-transform active:scale-90 border-b-8 border-black/20`;
                balloon.style.left = pos.left;
                balloon.style.top = pos.top;
                balloon.dataset.val = val;
                balloon.dataset.correct = (val === correctAnswer);

                // Inner Content (Answer Value & String)
                balloon.innerHTML = `
                    <div class="text-4xl sm:text-5xl font-black ${color.text} drop-shadow-md mb-1">${val}</div>
                    <div class="w-3 h-4 bg-amber-700/40 rounded-b-md absolute -bottom-3"></div>
                    <div class="w-0.5 h-12 bg-white/60 absolute -bottom-14"></div>
                `;

                // Interactive Click / Pinch Listener
                balloon.onclick = (e) => {
                    e.stopPropagation();
                    handleTargetSelection(balloon);
                };

                container.appendChild(balloon);
            });
        }

        // Check if Reticle position hits a balloon (Used for Camera Pinch Gesture)
        function checkTargetHit(x, y) {
            const balloons = document.querySelectorAll('#balloons-container > div');
            balloons.forEach(balloon => {
                const rect = balloon.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    handleTargetSelection(balloon);
                }
            });
        }

        // Handle Target Selection Logic
        function handleTargetSelection(balloonEl) {
            if (balloonEl.classList.contains('popping')) return;

            playPopSound();
            balloonEl.classList.add('popping');

            const isCorrect = balloonEl.dataset.correct === 'true';

            setTimeout(() => {
                if (isCorrect) {
                    playCorrectSound();
                    score += 100;
                    updateNavbarInfo();
                    nextQuestion();
                } else {
                    playWrongSound();
                    showFeedbackModal();
                }
            }, 300);
        }

        // Advance to Next Question or Level
        function nextQuestion() {
            currentQuestionIdx++;
            if (currentQuestionIdx >= GAME_LEVELS[currentLevelIdx].questions.length) {
                // Level Cleared
                currentLevelIdx++;
                currentQuestionIdx = 0;

                if (currentLevelIdx >= GAME_LEVELS.length) {
                    // Game Complete
                    showFinalResult();
                    return;
                }
            }
            updateNavbarInfo();
            loadQuestion();
        }

        // Show Educational Feedback Modal
        function showFeedbackModal() {
            const qData = GAME_LEVELS[currentLevelIdx].questions[currentQuestionIdx];
            document.getElementById('feedback-content').innerHTML = `
                <p class="font-bold text-gray-800 mb-1">Soal: ${qData.question}</p>
                <p class="text-amber-900">${qData.explanation}</p>
            `;
            document.getElementById('modal-feedback').classList.remove('hidden');
        }

        function closeFeedback() {
            document.getElementById('modal-feedback').classList.add('hidden');
            loadQuestion();
        }

        // Show Final Result Screen
        function showFinalResult() {
            playVictorySound();
            screenGame.classList.add('hidden');
            screenResult.classList.remove('hidden');

            document.getElementById('result-appreciation').innerText = `Hebat Sekali, ${playerName}!`;
            document.getElementById('result-final-score').innerText = score;
        }

        // Reset Game to Play Again
        function resetGame() {
            screenResult.classList.add('hidden');
            screenWelcome.classList.remove('hidden');
            gameNavbar.classList.add('hidden');
        }

        // MEDIAPIPE HAND GESTURE INTEGRATION
        function initMediaPipeCamera() {
            const videoElement = document.getElementById('webcam');
            const statusDot = document.getElementById('cam-status-dot');
            const statusText = document.getElementById('cam-status-text');

            statusText.innerText = "Menghubungkan Kamera...";

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            camera.start().then(() => {
                isCameraActive = true;
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = "Kamera Aktif (Gestur)";
            }).catch(err => {
                console.error("Camera Error:", err);
                statusText.innerText = "Kamera Gagal (Gunakan Mouse/Touch)";
                statusDot.className = "w-3 h-3 rounded-full bg-red-500";
            });
        }

        // Process Hand Landmarks
        function onHandResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                return;
            }

            const landmarks = results.multiHandLandmarks[0];

            // Index Finger Tip (Landmark 8) & Thumb Tip (Landmark 4)
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];

            // Map mirrored camera coordinates to screen
            const screenX = (1 - indexTip.x) * window.innerWidth;
            const screenY = indexTip.y * window.innerHeight;

            updateReticlePosition(screenX, screenY);

            // Calculate Pinch Distance between Index Tip and Thumb Tip
            const distance = Math.hypot(
                (indexTip.x - thumbTip.x),
                (indexTip.y - thumbTip.y)
            );

            // Threshold for Pinch Gesture
            if (distance < 0.08) {
                const now = Date.now();
                if (!isPinching && (now - lastPinchTime > 400)) {
                    isPinching = true;
                    lastPinchTime = now;
                    customReticle.classList.add('scale-75', 'bg-red-500/50');
                    checkTargetHit(screenX, screenY);
                }
            } else {
                isPinching = false;
                customReticle.classList.remove('scale-75', 'bg-red-500/50');
            }
        }
    </script>
</body>
</html>
